services:
  - type: web
    name: studycrafter-rag-api
    env: python
    buildCommand: "pip install -r requirements.txt && python -m backend.rag.ingestion"
    startCommand: "uvicorn backend.rag_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE_PATH
        value: ./data/vector_store
